name: Release

on:
  push:
    tags: ["v*"]
  # Re-run a release for an existing tag, for example after npm credentials
  # are configured. Gates and artifacts are always built from the tagged code.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # The secrets context is unavailable inside step `if:` conditions, so the
    # token is exposed as job-level env and the publish step gates on that.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell

      - name: Verify the tag matches ENGINE_VERSION
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(node -p "require('./packages/facade/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package version $version" >&2
            exit 1
          fi

      - name: Full engineering gates (M0-M9)
        run: pnpm release:gate
        env:
          VITE_PINGO_BUILD_ID: ${{ github.sha }}

      - name: Verify publishable tarballs
        run: pnpm npm:release:verify

      # Both the artifacts and the publish set come from the same list the
      # verifier checked, so a package can never be shipped unverified and a
      # newly verified one can never be left behind. The hand-written copy of
      # this list had already drifted: it was missing style-preprocess.
      - name: Resolve the release package set
        id: packages
        run: |
          set -euo pipefail
          packages="$(node -e "import('./scripts/check-npm-release.mjs').then((module) => console.log(module.RELEASE_PACKAGES.join(' ')))")"
          echo "list=$packages" >> "$GITHUB_OUTPUT"

      - name: Pack release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for package in ${{ steps.packages.outputs.list }}; do
            (cd "packages/$package" && pnpm pack --pack-destination ../../release-artifacts)
          done
          cp packages/host/wasm/manifest.json release-artifacts/wasm-manifest.json

      # Idempotent so the workflow can be re-run for the same tag, for example
      # after npm credentials are configured.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "pingo $RELEASE_TAG" \
              --generate-notes \
              release-artifacts/*
          fi

      # Named packages rather than `-r`: the workspace also holds packages that
      # are not part of a release -- @dopejs/pingo-ui is still 0.0.0 and has no
      # tarball verification -- and npm does not let an accidental publish be
      # taken back. The list is in dependency order.
      - name: Publish to npm with provenance
        if: env.NPM_TOKEN != ''
        run: |
          set -euo pipefail
          for package in ${{ steps.packages.outputs.list }}; do
            (cd "packages/$package" && pnpm publish --access public --no-git-checks --provenance)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Note skipped npm publish
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not configured; GitHub release created without npm publish"
