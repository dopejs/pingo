[package]
name = "pingo-collections"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
# Debug output has no business in a Core that ships to a browser, and a stray
# line survives a review far more easily than it survives a lint. Tests say
# `#[allow]` where they mean to print.
print_stderr = "deny"
print_stdout = "deny"
