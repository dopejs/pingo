[package]
name = "pingo-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["rich-text"]
# Document-level rich text: the block position space, the three selection
# kinds, the structure round trip, and styled-run layout. Turning it off leaves
# single-style text and single-value editing, and is how a build that has to
# fit a tighter WASM budget drops the capability wholesale rather than shipping
# it half-wired.
rich-text = ["pingo-edit/document"]

[dependencies]
pingo-abi = { path = "../pingo-abi" }
pingo-anim = { path = "../pingo-anim" }
pingo-collections = { path = "../pingo-collections" }
pingo-edit = { path = "../pingo-edit" }
pingo-hit = { path = "../pingo-hit" }
pingo-layout = { path = "../pingo-layout" }
pingo-paint = { path = "../pingo-paint" }
pingo-scene = { path = "../pingo-scene" }
pingo-scroll = { path = "../pingo-scroll" }
pingo-text = { path = "../pingo-text" }

[dev-dependencies]
pingo-headless = { path = "../pingo-headless" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[package.metadata.wasm-pack.profile.release]
# Keep the rustc `opt-level=z` layout, which compresses better than Binaryen's
# full -Oz pipeline for this module, then remove byte-identical functions and
# dead local structure only. `--converge` repeats exactly this list until it
# stops changing the module: each pass exposes work for the others, and one
# sweep leaves that on the table. wasm-pack owns the pinned Binaryen download.
wasm-opt = [
  "--converge",
  "--duplicate-function-elimination",
  "--vacuum",
  "--dae-optimizing",
  "--optimize-instructions",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
]
