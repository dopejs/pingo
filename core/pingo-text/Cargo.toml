[package]
name = "pingo-text"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fontdue = { version = "=0.9.4", default-features = false, features = ["std"] }
swash = { version = "=0.2.10", default-features = false, features = ["libm"] }
unicode-linebreak = "=0.1.5"
unicode-segmentation = "=1.13.3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
# Debug output has no business in a Core that ships to a browser, and a stray
# line survives a review far more easily than it survives a lint. Tests say
# `#[allow]` where they mean to print.
print_stderr = "deny"
print_stdout = "deny"
